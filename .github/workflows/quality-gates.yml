name: Portfolio quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate static site
        run: node scripts/validate-site.mjs

      - name: Reject browser bootstrap payloads
        run: |
          if grep -RInE 'DecompressionStream|document\.write\s*\(|\batob\s*\(' --include='*.html' .; then
            echo 'Prohibited browser bootstrap code detected.'
            exit 1
          fi

      - name: Verify required routes
        run: |
          test -f index.html
          test -f eu-chat-control/index.html
          test -f russian-jfk-dossier/index.html
          test -f robots.txt
          test -f sitemap.xml
