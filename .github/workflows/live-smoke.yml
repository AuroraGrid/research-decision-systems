name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - '.github/workflows/live-smoke.yml'
      - 'index.html'
      - 'eu-chat-control/**'
      - 'russian-jfk-dossier/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'

permissions:
  contents: read

concurrency:
  group: live-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production routes, content, and headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://hasan-research-systems.vercel.app'

          check_page() {
            path="$1"
            marker="$2"
            url="$base$path"
            code=$(curl --silent --show-error --location --retry 3 --max-time 30 --output /tmp/body --write-out '%{http_code}' "$url")
            test "$code" = '200' || { echo "$url returned $code"; exit 1; }
            grep --fixed-strings --quiet "$marker" /tmp/body
            echo "Verified $url"
          }

          check_page '/' 'Rigorous evaluation for AI systems'
          check_page '/eu-chat-control' 'EU Chat Control Monitor'
          check_page '/russian-jfk-dossier' 'The Russian JFK Dossier'
          check_page '/robots.txt' 'User-agent: *'
          check_page '/sitemap.xml' 'https://hasan-research-systems.vercel.app/'

          curl --silent --show-error --location --dump-header /tmp/headers --output /tmp/home "$base/"
          grep -qi '^x-content-type-options: nosniff' /tmp/headers
          grep -qi '^x-frame-options: DENY' /tmp/headers
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/headers
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' /tmp/headers
