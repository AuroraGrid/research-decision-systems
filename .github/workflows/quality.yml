name: Required quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    name: site-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate site, routes, assets, metadata, and headers
        run: npm test

      - name: Validate Vercel configuration JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json','utf8')); console.log('vercel.json is valid JSON')"
